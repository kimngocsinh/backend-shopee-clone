spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shopee_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.shopee.backend: INFO
    org.hibernate.SQL: WARN
